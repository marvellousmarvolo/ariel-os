[package]
name = "mountain-mqtt"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["mqtt", "tokio", "embedded-hal-async"]
categories = [
  "asynchronous",
  "embedded",
  "network-programming",
  "no-std::no-alloc",
  "encoding",
]
description = "A no_std compatible, async MQTT v5 client for tokio and embedded use"
repository = "https://github.com/mountainlizard/mountain-mqtt"
readme = "README.md"

[dependencies]
heapless = { workspace = true }

embedded-io = { version = "0.7.1", optional = true }
embedded-io-async = { version = "0.7.0", optional = true }

embedded-hal-async = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }


[dev-dependencies]
embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }
embedded-hal-async = { workspace = true }

[features]
default = ["embedded-io-async", "embedded-hal-async", "defmt"]
defmt = ["dep:defmt"]
embedded-io-async = ["dep:embedded-io-async", "dep:embedded-io"]
embedded-hal-async = ["dep:embedded-hal-async"]
